name: Build Polar Doctor

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Nécessaire pour que softprops/action-gh-release puisse créer la release
permissions:
  contents: write

# Serveur web polar_doctor_web : glib + sqlite, aucun toolkit graphique.
# Chaque plateforme compile PUIS démarre le serveur et interroge l'API
# (test de fumée) avant d'empaqueter.

jobs:
  build-linux:
    name: Build on Linux x64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libglib2.0-dev libsqlite3-dev curl

    - name: Build
      run: make

    - name: Unit tests
      run: make test

    - name: Smoke test
      run: |
        ./polar_doctor_web --help
        ./polar_doctor_web --port 18080 & PID=$!
        sleep 1
        curl -fsS http://127.0.0.1:18080/api/polar
        curl -fsS -o /dev/null http://127.0.0.1:18080/
        kill $PID

    - name: Create package
      run: |
        mkdir -p dist/polar_doctor-linux-x64
        cp polar_doctor_web web/polar_doctor_web.service web/polar_doctor_web.default \
           README.md LICENSE dist/polar_doctor-linux-x64/
        tar -C dist -czf dist/polar_doctor-linux-x64.tar.gz polar_doctor-linux-x64

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: polar_doctor-linux-x64
        path: dist/polar_doctor-linux-x64.tar.gz
        retention-days: 30

  build-linux-arm64:
    name: Build on Linux ARM64
    runs-on: ubuntu-latest
    # Build QEMU lent/fragile : ne doit pas bloquer la release. Borné dans le temps
    # et toléré en échec (les autres plateformes et la release continuent).
    timeout-minutes: 60
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up QEMU for ARM64
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - name: Build and smoke test in ARM64 container
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          arm64v8/ubuntu:22.04 \
          bash -c "
            export DEBIAN_FRONTEND=noninteractive && \
            apt-get update && \
            apt-get install -y build-essential pkg-config libglib2.0-dev libsqlite3-dev curl && \
            make && \
            ./polar_doctor_web --help && \
            { ./polar_doctor_web --port 18080 & PID=\$!; sleep 3; \
              curl -fsS -o /dev/null http://127.0.0.1:18080/api/polar; R=\$?; kill \$PID; exit \$R; }
          "

    - name: Verify binary architecture
      run: |
        file polar_doctor_web
        readelf -h polar_doctor_web | grep Machine || true

    - name: Create package
      run: |
        mkdir -p dist/polar_doctor-linux-arm64
        cp polar_doctor_web web/polar_doctor_web.service web/polar_doctor_web.default \
           README.md LICENSE dist/polar_doctor-linux-arm64/
        tar -C dist -czf dist/polar_doctor-linux-arm64.tar.gz polar_doctor-linux-arm64

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: polar_doctor-linux-arm64
        path: dist/polar_doctor-linux-arm64.tar.gz
        retention-days: 30

  build-windows:
    name: Build on Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          curl
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-glib2
          mingw-w64-x86_64-sqlite3

    - name: Build
      run: make

    - name: Unit tests
      run: make test

    - name: Smoke test
      run: |
        ./polar_doctor_web.exe --help
        ./polar_doctor_web.exe --port 18080 & PID=$!
        sleep 2
        curl -fsS http://127.0.0.1:18080/api/polar
        curl -fsS -o /dev/null http://127.0.0.1:18080/
        kill $PID 2>/dev/null || taskkill //F //IM polar_doctor_web.exe

    - name: Test web.conf (modèle créé, mot de passe lu)
      run: |
        CONF="$(cygpath -u "$LOCALAPPDATA")/polar_doctor/web.conf"
        test -f "$CONF" && grep -q '^#WEB_AUTH=' "$CONF"
        printf 'WEB_AUTH=ci:test\r\nPORT=18081\r\n' > "$CONF"
        ./polar_doctor_web.exe & PID=$!
        sleep 2
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/polar)" = 401
        curl -fsS -u ci:test -o /dev/null http://127.0.0.1:18081/api/polar
        kill $PID 2>/dev/null || taskkill //F //IM polar_doctor_web.exe

    - name: Create package (exe + DLL)
      run: |
        mkdir -p dist/polar_doctor_win
        cp polar_doctor_web.exe README.md LICENSE dist/polar_doctor_win/
        # DLL MinGW réellement liées (glib, sqlite, runtime)
        ldd polar_doctor_web.exe | grep -i '/mingw64/' | awk '{print $3}' | sort -u \
          | xargs -I {} cp {} dist/polar_doctor_win/
        ls -la dist/polar_doctor_win

    - name: Test packaged exe (DLL complètes)
      run: |
        cd dist/polar_doctor_win
        PATH=/usr/bin ./polar_doctor_web.exe --help

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: polar_doctor-windows-x64
        path: dist/polar_doctor_win/
        retention-days: 30

  create-release:
    name: Create Release
    needs: [build-linux, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: polar_doctor-linux-x64
        path: ./artifacts

    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@v8
      continue-on-error: true  # ARM64 peut avoir échoué : ne bloque pas la release
      with:
        name: polar_doctor-linux-arm64
        path: ./artifacts

    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: polar_doctor-windows-x64
        path: ./polar_doctor_win

    - name: Create Windows zip
      run: |
        mkdir -p artifacts
        zip -r artifacts/polar_doctor-windows-x64.zip polar_doctor_win/

    - name: Generate checksums
      run: |
        cd artifacts
        for f in polar_doctor-linux-x64.tar.gz polar_doctor-linux-arm64.tar.gz polar_doctor-windows-x64.zip; do
          [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
        done
        sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS.txt || true
        cat SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          artifacts/polar_doctor-linux-x64.tar.gz
          artifacts/polar_doctor-linux-x64.tar.gz.sha256
          artifacts/polar_doctor-linux-arm64.tar.gz
          artifacts/polar_doctor-linux-arm64.tar.gz.sha256
          artifacts/polar_doctor-windows-x64.zip
          artifacts/polar_doctor-windows-x64.zip.sha256
          artifacts/SHA256SUMS.txt
        body: |
          # Polar Doctor ${{ github.ref_name }}

          Polar Doctor est désormais une **interface web** : un petit serveur
          (`polar_doctor_web`) tourne sur l'ordinateur de bord et s'utilise depuis
          n'importe quel navigateur (PC, tablette, téléphone). Voir le CHANGELOG.

          ## 📦 Installation

          ### Linux x86_64 / ARM64 (Raspberry Pi)
          ```bash
          tar -xzf polar_doctor-linux-x64.tar.gz     # ou -arm64
          cd polar_doctor-linux-x64
          ./polar_doctor_web ~/MonBateau             # puis http://localhost:8081
          ```
          En service systemd (démarrage automatique, accès depuis le réseau) :
          ```bash
          sudo install -m755 polar_doctor_web /usr/local/bin/
          sed "s/@USER@/$USER/" polar_doctor_web.service | sudo tee /etc/systemd/system/polar_doctor_web.service
          sudo install -m600 polar_doctor_web.default /etc/default/polar_doctor_web
          sudo nano /etc/default/polar_doctor_web      # WEB_AUTH=utilisateur:motdepasse
          sudo systemctl daemon-reload && sudo systemctl enable --now polar_doctor_web
          ```

          ### Windows
          1. Extraire `polar_doctor-windows-x64.zip`
          2. Lancer `polar_doctor_web.exe C:\chemin\MonBateau`
          3. Ouvrir http://localhost:8081

          Pour un accès depuis le réseau, ouvrir le fichier de réglages créé au premier
          lancement (Windows + R) : `notepad %LOCALAPPDATA%\polar_doctor\web.conf`, et
          décommenter `WEB_AUTH=utilisateur:motdepasse` et `BIND=0.0.0.0`, puis relancer.

          ## 🔐 Vérification des fichiers
          ```bash
          sha256sum -c polar_doctor-linux-x64.tar.gz.sha256
          ```
          Ou consultez `SHA256SUMS.txt`.

          ## 🐛 Bugs
          Signalez les bugs sur https://github.com/${{ github.repository }}/issues
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
